name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build project
        env:
          CI: false
        run: |
          npm ci
          npm run build

      - name: Upload to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: /domains/phaminh.com/public_html/

  # A red deploy previously notified nobody — same silent-failure trap that
  # let the YouTube token outage run 10 days. Reuses the automation-failure
  # issue (see seo-automation.yml) so all pipeline failures land in one thread.
  alert-on-failure:
    # GITHUB_TOKEN is read-only by default in this repo; this grant elevates it
    # for THIS JOB only. GH_PAT can push code but has no Issues permission —
    # its 403 on label creation is what broke the alert's first real firing.
    permissions:
      issues: write
    needs: [ftp-deploy]
    if: always() && needs.ftp-deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const LABEL = 'automation-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '**Failed job:** `ftp-deploy` — the SITE DEPLOY failed; the live site is still serving the previous build.',
              '',
              `**Run:** ${runUrl}`,
              '',
              'Usual causes: a build/prerender error from the last commit (check the "Build project" step), or Hostinger FTP flakiness (re-run the workflow once before digging).',
              '',
              '_Close once a re-run or fix goes green — it reopens on the next failure._',
            ].join('\n');
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'b60205', description: 'Scheduled automation failed' });
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL, per_page: 1 });
            if (open.length === 0) {
              await github.rest.issues.create({ ...context.repo, title: '⚠️ Site deploy is failing', body, labels: [LABEL], assignees: [context.repo.owner] });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            }
