name: Phaminh SEO Automation

on:
  schedule:
    # Bulk SEO refresh every 6 hours (Vimeo titles/descriptions + gallery JSON)
    - cron: '0 */6 * * *'
    # YouTube sync: Sun/Tue/Thu/Sat at 23:00 UTC (4pm Pacific / 6pm Central).
    # Wedding audiences browse heaviest Sun + Tue-Thu evenings; posting ~2-4h
    # before the 7-10pm local peak gives YouTube time to index.
    #
    # Still ONE video per run — four slots beats three-at-once, because a
    # steady drip is what the algorithm rewards. At 4/week the ~90-video
    # Vimeo backlog clears in ~5 months instead of ~11 at the old 2/week.
    # Quota is not a constraint: an upload costs 1,600 units of 10,000/day.
    - cron: '0 23 * * 0,2,4,6'
  workflow_dispatch:
    inputs:
      vimeo_url:
        description: 'Vimeo video URL to process (leave blank for bulk scheduled run)'
        required: false
        type: string
      run_youtube_sync:
        description: 'Also run YouTube sync (only used on manual dispatch)'
        required: false
        type: boolean
        default: false

# Never let two runs overlap (e.g. a slow bulk run colliding with the next cron)
concurrency:
  group: seo-automation
  cancel-in-progress: false

jobs:
  # ── Manual: add/update a specific video in films.js ──────────────────────────
  single-video-seo:
    if: ${{ github.event.inputs.vimeo_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Run SEO automation for single video
        id: seo
        env:
          VIMEO_URL: ${{ github.event.inputs.vimeo_url }}
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/seo-automation.js

      - name: Commit updated films.js and sitemap
        run: |
          git config user.email "seo-bot@phaminh.com"
          git config user.name "Phaminh SEO Bot"
          git add src/data/films.js public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes — film may already exist in films.js"
          else
            git commit -m "Add new film: ${{ steps.seo.outputs.film_title }}"
            git pull --rebase origin main
            git push
          fi

  # ── Scheduled: bulk Vimeo SEO + refresh vimeo-videos.json ───────────────────
  bulk-seo-refresh:
    # Runs on the 6-hour SEO cron OR on a manual dispatch with no Vimeo URL.
    # The schedule check keeps it off the 5-day YouTube cron.
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.vimeo_url == '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci && cd scripts && npm install

      - name: Verify environment
        env:
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "VIMEO_ACCESS_TOKEN set: ${{ secrets.VIMEO_ACCESS_TOKEN != '' }}"
          echo "VIMEO_USER_ID set: ${{ secrets.VIMEO_USER_ID != '' }}"
          echo "ANTHROPIC_API_KEY set: ${{ secrets.ANTHROPIC_API_KEY != '' }}"
          echo "NOTION_API_KEY set: ${{ secrets.NOTION_API_KEY != '' }}"
          echo "NOTION_DATABASE_ID set: ${{ secrets.NOTION_DATABASE_ID != '' }}"
          echo "Node version: $(node --version)"
          echo "Scripts node_modules dotenv exists: $(test -d scripts/node_modules/dotenv && echo yes || echo NO)"
          node --check scripts/vimeo-seo.js && node --check scripts/update-cine-gallery.js && node --check scripts/notion-log.js && echo "syntax ok"

      - name: Bulk update Vimeo SEO (titles, descriptions, tags)
        env:
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/vimeo-seo.js

      - name: Refresh vimeo-videos.json from Vimeo API
        env:
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: node scripts/update-cine-gallery.js

      # No [skip ci]: a real data change should trigger deploy.yml so the live
      # gallery stays current. Runs with no changes commit nothing.
      - name: Commit updated video data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/vimeo-videos.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit"
          else
            git commit -m "chore: auto-update vimeo-videos.json"
            git pull --rebase origin main
            git push
          fi

  # ── Scheduled: Vimeo → YouTube sync, one video 4x/week ──────────────────────
  youtube-sync:
    # Runs on the Sun/Tue/Thu/Sat cron OR a manual dispatch with run_youtube_sync=true.
    # The schedule string below MUST stay byte-identical to the `on.schedule`
    # cron above — GitHub matches it literally, and a mismatch silently stops
    # the sync from ever running on schedule.
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 23 * * 0,2,4,6')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_youtube_sync == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps
        run: cd scripts && npm install

      # Nightly channel — Vimeo breaks yt-dlp's extractor periodically and
      # fixes land in nightly first. yt-dlp is only the fallback downloader;
      # the script prefers Vimeo API direct download links.
      - name: Install yt-dlp (nightly)
        run: pip install --user --pre "yt-dlp[default]"

      - name: Sync one Vimeo video to YouTube
        env:
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Base64-encoded Netscape cookie file. Base64 survives copy-paste
          # (plain cookie text kept losing its required TAB separators when
          # pasted into the GitHub secrets UI).
          VIMEO_COOKIES_B64: ${{ secrets.VIMEO_COOKIES_B64 }}
        run: |
          if [ -n "$VIMEO_COOKIES_B64" ]; then
            # Strip ALL whitespace first — pasting into the GitHub UI can wrap
            # the value and introduce spaces/newlines that break base64 -d.
            printf '%s' "$VIMEO_COOKIES_B64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/vimeo-cookies.txt"
            export VIMEO_COOKIES_PATH="$RUNNER_TEMP/vimeo-cookies.txt"
            echo "Cookie file decoded: $(wc -l < "$RUNNER_TEMP/vimeo-cookies.txt") lines"
          else
            echo "WARNING: VIMEO_COOKIES_B64 secret is empty or missing — yt-dlp will likely get HTTP 401"
          fi
          node scripts/youtube-sync.js --limit=1

      # Persist registry fallback entries written during the run — losing them
      # risks duplicate uploads next cycle when Vimeo tagging failed.
      # skip-ci is safe here: nothing in the site build reads the registry.
      - name: Commit registry if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/youtube-registry.json
          if git diff --cached --quiet; then
            echo "Registry unchanged"
          else
            git commit -m "chore: update youtube-registry.json [skip ci]"
            git pull --rebase origin main
            git push
          fi

  # ── Alert on any failure ────────────────────────────────────────────────────
  # A red Action notifies nobody by default. The 2026-07-29 token expiry ran
  # 10 days unnoticed because of that. This opens (or pings) a single assigned
  # GitHub issue so a failure reaches Minh's inbox the same day.
  alert-on-failure:
    needs: [single-video-seo, bulk-seo-refresh, youtube-sync]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        uses: actions/github-script@v7
        with:
          # GH_PAT, not GITHUB_TOKEN — the default token is read-only in this repo.
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const LABEL = 'automation-failure';
            const TITLE = '⚠️ Phaminh automation is failing';
            // Re-ping at most once per ~12h so a broken 6-hour cron (4 runs/day)
            // doesn't bury the thread in duplicate comments.
            const QUIET_HOURS = 11;

            const results = {
              'single-video-seo': ${{ toJSON(needs['single-video-seo'].result) }},
              'bulk-seo-refresh': ${{ toJSON(needs['bulk-seo-refresh'].result) }},
              'youtube-sync':     ${{ toJSON(needs['youtube-sync'].result) }},
            };
            const failed = Object.entries(results)
              .filter(([, r]) => r === 'failure')
              .map(([j]) => j);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;

            const body = [
              `**Failed job(s):** ${failed.map(j => '`' + j + '`').join(', ')}`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `### Most likely causes`,
              `- \`invalid_grant\` in **youtube-sync** — the YouTube refresh token died.`,
              `  Re-mint it first, check the OAuth publish status second:`,
              `  \`cd ~/Documents/GitHub/iphaminh && node scripts/youtube-auth.js\`,`,
              `  then update the \`YOUTUBE_REFRESH_TOKEN\` secret.`,
              `- **Cookies expired** — refresh \`VIMEO_COOKIES_B64\` per CLAUDE.md §6.`,
              `- Anything in **bulk-seo-refresh** — usually a Vimeo/Anthropic API hiccup.`,
              `  One red run is not an outage; two in a row is.`,
              ``,
              `_Close this issue once the next run is green — it reopens automatically on the next failure._`,
            ].join('\n');

            // Make sure the label exists (creating an issue with an unknown label
            // is not reliable across API versions).
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo, name: LABEL, color: 'b60205',
                description: 'Scheduled automation failed',
              });
            }

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 1,
            });

            if (open.length === 0) {
              const { data: issue } = await github.rest.issues.create({
                ...context.repo, title: TITLE, body, labels: [LABEL],
                assignees: [context.repo.owner],
              });
              core.notice(`Opened failure issue #${issue.number}`);
              return;
            }

            const issue = open[0];
            const ageHours = (Date.now() - new Date(issue.updated_at)) / 3.6e6;
            if (ageHours < QUIET_HOURS) {
              core.notice(`Issue #${issue.number} pinged ${ageHours.toFixed(1)}h ago — staying quiet.`);
              return;
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number, body: `Still failing.\n\n${body}`,
            });
            core.notice(`Commented on existing failure issue #${issue.number}`);
